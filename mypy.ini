[mypy]
# Strict mode - enables all optional checks
strict = True

# Disable warnings for unused type: ignore comments
# (they may be needed for VSCode/IDE compatibility even if mypy doesn't report the error)
disable_error_code = unused-ignore

# Error output formatting
pretty = True
show_error_codes = True
show_error_context = True
show_column_numbers = True

# Warnings
warn_unused_configs = True
warn_redundant_casts = True
warn_return_any = True
warn_no_return = True
warn_unreachable = True
# Note: warn_unused_ignores disabled to avoid noise from legitimate type: ignore comments

# Optional features
disallow_untyped_defs = True
disallow_untyped_calls = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
disallow_any_unimported = True
disallow_any_decorated = True
disallow_any_explicit = True
disallow_any_generics = True

# Compatibility
python_version = 3.10

# Output
incremental = True
cache_dir = .mypy_cache
